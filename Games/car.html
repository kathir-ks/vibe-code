<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Car Racing</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            z-index: 100;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }
        
        #speedometer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #1a1a1a, #333);
            border: 4px solid #ff6b35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
        }
        
        #speedText {
            color: #ff6b35;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff6b35;
        }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ffffff;
            z-index: 100;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            backdrop-filter: blur(3px);
        }
        
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #ffffff;
            border-radius: 10px;
            z-index: 100;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b35;
            font-size: 32px;
            text-align: center;
            z-index: 200;
            display: none;
            text-shadow: 0 0 20px #ff6b35;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .neon-glow {
            animation: neonGlow 2s ease-in-out infinite alternate;
        }
        
        @keyframes neonGlow {
            from { text-shadow: 0 0 10px #ff6b35, 0 0 20px #ff6b35, 0 0 30px #ff6b35; }
            to { text-shadow: 0 0 5px #ff6b35, 0 0 10px #ff6b35, 0 0 15px #ff6b35; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div>Lap: <span id="lap">1</span>/3</div>
            <div>Time: <span id="time">0:00</span></div>
            <div>Best: <span id="bestTime">--:--</span></div>
            <div>Checkpoints: <span id="checkpoints">0</span>/4</div>
        </div>
        
        <div id="speedometer">
            <div id="speedText">0</div>
        </div>
        
        <div id="minimap"></div>
        
        <div id="instructions">
            <div><strong>Controls:</strong></div>
            <div>W/↑: Accelerate | S/↓: Brake/Reverse</div>
            <div>A/←: Turn Left | D/→: Turn Right</div>
            <div>Space: Handbrake | R: Reset Car</div>
        </div>
        
        <div id="gameOver">
            <div class="neon-glow">RACE COMPLETE!</div>
            <div style="font-size: 16px; margin-top: 20px;">Press ENTER to restart</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        class CarRacing {
            constructor() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                
                // Game state
                this.currentLap = 1;
                this.maxLaps = 3;
                this.startTime = Date.now();
                this.bestTime = null;
                this.checkpointsPassed = 0;
                this.totalCheckpoints = 4;
                this.gameComplete = false;
                
                // Car physics
                this.car = null;
                this.carSpeed = 0;
                this.maxSpeed = 1.5;
                this.acceleration = 0.05;
                this.deceleration = 0.02;
                this.turnSpeed = 0.03;
                this.carPosition = new THREE.Vector3(0, 1, 0);
                this.carRotation = 0;
                this.carVelocity = new THREE.Vector3();
                
                // Input
                this.keys = {};
                
                // Track elements
                this.checkpoints = [];
                this.trackPieces = [];
                this.obstacles = [];
                
                this.init();
                this.createWorld();
                this.createCar();
                this.createTrack();
                this.bindEvents();
                this.animate();
            }
            
            init() {
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x87CEEB);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.fog = new THREE.Fog(0x87CEEB, 50, 200);
                document.getElementById('gameContainer').appendChild(this.renderer.domElement);
                
                // Lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(50, 50, 50);
                directionalLight.castShadow = true;
                directionalLight.shadow.mapSize.width = 2048;
                directionalLight.shadow.mapSize.height = 2048;
                this.scene.add(directionalLight);
                
                // Sun
                const sunGeometry = new THREE.SphereGeometry(5, 32, 32);
                const sunMaterial = new THREE.MeshBasicMaterial({ 
                    color: 0xFFD700,
                    transparent: true,
                    opacity: 0.8
                });
                const sun = new THREE.Mesh(sunGeometry, sunMaterial);
                sun.position.set(80, 60, -100);
                this.scene.add(sun);
            }
            
            createWorld() {
                // Ground
                const groundGeometry = new THREE.PlaneGeometry(300, 300);
                const groundMaterial = new THREE.MeshLambertMaterial({ 
                    color: 0x228B22,
                    transparent: true,
                    opacity: 0.8
                });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                this.scene.add(ground);
                
                // Trees
                this.createTrees();
                
                // Mountains
                this.createMountains();
                
                // Clouds
                this.createClouds();
            }
            
            createTrees() {
                for (let i = 0; i < 30; i++) {
                    const treeGroup = new THREE.Group();
                    
                    // Trunk
                    const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.8, 6);
                    const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                    const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                    trunk.position.y = 3;
                    trunk.castShadow = true;
                    treeGroup.add(trunk);
                    
                    // Leaves
                    const leavesGeometry = new THREE.SphereGeometry(3, 8, 8);
                    const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
                    const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                    leaves.position.y = 7;
                    leaves.castShadow = true;
                    treeGroup.add(leaves);
                    
                    // Random position (avoid track area)
                    let x, z;
                    do {
                        x = (Math.random() - 0.5) * 280;
                        z = (Math.random() - 0.5) * 280;
                    } while (this.isOnTrack(x, z));
                    
                    treeGroup.position.set(x, 0, z);
                    this.scene.add(treeGroup);
                }
            }
            
            createMountains() {
                for (let i = 0; i < 8; i++) {
                    const mountainGeometry = new THREE.ConeGeometry(
                        Math.random() * 15 + 10,
                        Math.random() * 30 + 20,
                        8
                    );
                    const mountainMaterial = new THREE.MeshLambertMaterial({ 
                        color: 0x696969 
                    });
                    const mountain = new THREE.Mesh(mountainGeometry, mountainMaterial);
                    
                    const angle = (i / 8) * Math.PI * 2;
                    const distance = 120 + Math.random() * 50;
                    mountain.position.set(
                        Math.cos(angle) * distance,
                        mountain.geometry.parameters.height / 2,
                        Math.sin(angle) * distance
                    );
                    
                    this.scene.add(mountain);
                }
            }
            
            createClouds() {
                for (let i = 0; i < 15; i++) {
                    const cloudGeometry = new THREE.SphereGeometry(
                        Math.random() * 5 + 3,
                        8, 8
                    );
                    const cloudMaterial = new THREE.MeshBasicMaterial({ 
                        color: 0xffffff,
                        transparent: true,
                        opacity: 0.8
                    });
                    const cloud = new THREE.Mesh(cloudGeometry, cloudMaterial);
                    
                    cloud.position.set(
                        (Math.random() - 0.5) * 200,
                        Math.random() * 20 + 30,
                        (Math.random() - 0.5) * 200
                    );
                    
                    this.scene.add(cloud);
                }
            }
            
            createCar() {
                this.car = new THREE.Group();
                
                // Car body
                const bodyGeometry = new THREE.BoxGeometry(4, 1.5, 2);
                const bodyMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0xFF0000,
                    shininess: 100
                });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.position.y = 1;
                body.castShadow = true;
                this.car.add(body);
                
                // Car roof
                const roofGeometry = new THREE.BoxGeometry(2.5, 1, 1.8);
                const roofMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x800000,
                    shininess: 100
                });
                const roof = new THREE.Mesh(roofGeometry, roofMaterial);
                roof.position.set(0, 2, 0);
                roof.castShadow = true;
                this.car.add(roof);
                
                // Wheels
                const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.3);
                const wheelMaterial = new THREE.MeshPhongMaterial({ color: 0x333333 });
                
                const wheelPositions = [
                    [-1.3, 0.5, 1.2],
                    [1.3, 0.5, 1.2],
                    [-1.3, 0.5, -1.2],
                    [1.3, 0.5, -1.2]
                ];
                
                this.wheels = [];
                wheelPositions.forEach(pos => {
                    const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                    wheel.position.set(...pos);
                    wheel.rotation.z = Math.PI / 2;
                    wheel.castShadow = true;
                    this.car.add(wheel);
                    this.wheels.push(wheel);
                });
                
                // Headlights
                const headlightGeometry = new THREE.SphereGeometry(0.3);
                const headlightMaterial = new THREE.MeshBasicMaterial({ color: 0xFFFFAA });
                
                const leftHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
                leftHeadlight.position.set(-0.8, 1.2, 2.1);
                this.car.add(leftHeadlight);
                
                const rightHeadlight = new THREE.Mesh(headlightGeometry, headlightMaterial);
                rightHeadlight.position.set(0.8, 1.2, 2.1);
                this.car.add(rightHeadlight);
                
                this.car.position.copy(this.carPosition);
                this.scene.add(this.car);
            }
            
            createTrack() {
                // Create oval track with road segments
                const trackRadius = 40;
                const trackWidth = 8;
                const segments = 32;
                
                for (let i = 0; i < segments; i++) {
                    const angle1 = (i / segments) * Math.PI * 2;
                    const angle2 = ((i + 1) / segments) * Math.PI * 2;
                    
                    const roadGeometry = new THREE.RingGeometry(
                        trackRadius - trackWidth / 2,
                        trackRadius + trackWidth / 2,
                        0, Math.PI * 2 / segments
                    );
                    const roadMaterial = new THREE.MeshLambertMaterial({ 
                        color: 0x444444 
                    });
                    const roadSegment = new THREE.Mesh(roadGeometry, roadMaterial);
                    roadSegment.rotation.x = -Math.PI / 2;
                    roadSegment.rotation.z = angle1;
                    roadSegment.receiveShadow = true;
                    this.scene.add(roadSegment);
                }
                
                // Create checkpoints
                const checkpointPositions = [
                    [trackRadius, 0, 0],      // Right
                    [0, 0, trackRadius],      // Front  
                    [-trackRadius, 0, 0],     // Left
                    [0, 0, -trackRadius]      // Back
                ];
                
                checkpointPositions.forEach((pos, index) => {
                    const checkpointGeometry = new THREE.BoxGeometry(2, 8, 0.5);
                    const checkpointMaterial = new THREE.MeshBasicMaterial({ 
                        color: index === 0 ? 0x00FF00 : 0xFFFF00,
                        transparent: true,
                        opacity: 0.7
                    });
                    const checkpoint = new THREE.Mesh(checkpointGeometry, checkpointMaterial);
                    checkpoint.position.set(...pos);
                    checkpoint.position.y = 4;
                    this.scene.add(checkpoint);
                    
                    this.checkpoints.push({
                        mesh: checkpoint,
                        passed: false,
                        isStart: index === 0
                    });
                });
            }
            
            isOnTrack(x, z) {
                const distance = Math.sqrt(x * x + z * z);
                return distance > 32 && distance < 48;
            }
            
            bindEvents() {
                document.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Enter' && this.gameComplete) {
                        this.restart();
                    }
                });
                
                document.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
                
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }
            
            handleInput() {
                if (this.gameComplete) return;
                
                // Acceleration
                if (this.keys['KeyW'] || this.keys['ArrowUp']) {
                    this.carSpeed = Math.min(this.maxSpeed, this.carSpeed + this.acceleration);
                } else if (this.keys['KeyS'] || this.keys['ArrowDown']) {
                    this.carSpeed = Math.max(-this.maxSpeed * 0.5, this.carSpeed - this.acceleration);
                } else {
                    // Natural deceleration
                    if (this.carSpeed > 0) {
                        this.carSpeed = Math.max(0, this.carSpeed - this.deceleration);
                    } else if (this.carSpeed < 0) {
                        this.carSpeed = Math.min(0, this.carSpeed + this.deceleration);
                    }
                }
                
                // Handbrake
                if (this.keys['Space']) {
                    this.carSpeed *= 0.9;
                }
                
                // Steering (only when moving)
                if (Math.abs(this.carSpeed) > 0.01) {
                    if (this.keys['KeyA'] || this.keys['ArrowLeft']) {
                        this.carRotation += this.turnSpeed * (this.carSpeed / this.maxSpeed);
                    }
                    if (this.keys['KeyD'] || this.keys['ArrowRight']) {
                        this.carRotation -= this.turnSpeed * (this.carSpeed / this.maxSpeed);
                    }
                }
                
                // Reset car
                if (this.keys['KeyR']) {
                    this.resetCar();
                }
            }
            
            updateCar() {
                // Update car velocity based on rotation and speed
                this.carVelocity.x = Math.sin(this.carRotation) * this.carSpeed;
                this.carVelocity.z = Math.cos(this.carRotation) * this.carSpeed;
                
                // Update position
                this.carPosition.add(this.carVelocity);
                
                // Update car mesh
                this.car.position.copy(this.carPosition);
                this.car.rotation.y = this.carRotation;
                
                // Animate wheels
                this.wheels.forEach(wheel => {
                    wheel.rotation.x += this.carSpeed * 2;
                });
                
                // Update camera to follow car
                const cameraOffset = new THREE.Vector3(0, 8, -15);
                cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.carRotation);
                
                this.camera.position.copy(this.carPosition);
                this.camera.position.add(cameraOffset);
                this.camera.lookAt(this.carPosition);
            }
            
            checkCollisions() {
                // Check checkpoint collisions
                this.checkpoints.forEach((checkpoint, index) => {
                    const distance = this.carPosition.distanceTo(checkpoint.mesh.position);
                    if (distance < 5 && !checkpoint.passed) {
                        if (checkpoint.isStart && this.checkpointsPassed === this.totalCheckpoints) {
                            // Completed a lap
                            this.completeLap();
                        } else if (!checkpoint.isStart) {
                            checkpoint.passed = true;
                            this.checkpointsPassed++;
                            checkpoint.mesh.material.color.setHex(0x00FF00);
                        }
                    }
                });
                
                // Keep car on reasonable bounds
                const maxDistance = 80;
                if (this.carPosition.length() > maxDistance) {
                    this.resetCar();
                }
            }
            
            completeLap() {
                this.currentLap++;
                
                // Reset checkpoints
                this.checkpoints.forEach(checkpoint => {
                    checkpoint.passed = false;
                    if (!checkpoint.isStart) {
                        checkpoint.mesh.material.color.setHex(0xFFFF00);
                    }
                });
                this.checkpointsPassed = 0;
                
                if (this.currentLap > this.maxLaps) {
                    this.completeRace();
                }
            }
            
            completeRace() {
                this.gameComplete = true;
                const totalTime = Date.now() - this.startTime;
                
                if (!this.bestTime || totalTime < this.bestTime) {
                    this.bestTime = totalTime;
                }
                
                document.getElementById('gameOver').style.display = 'block';
            }
            
            resetCar() {
                this.carPosition.set(0, 1, 0);
                this.carRotation = 0;
                this.carSpeed = 0;
                this.carVelocity.set(0, 0, 0);
            }
            
            updateUI() {
                const currentTime = Date.now() - this.startTime;
                const minutes = Math.floor(currentTime / 60000);
                const seconds = Math.floor((currentTime % 60000) / 1000);
                
                document.getElementById('lap').textContent = Math.min(this.currentLap, this.maxLaps);
                document.getElementById('time').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                document.getElementById('checkpoints').textContent = this.checkpointsPassed;
                document.getElementById('speedText').textContent = Math.floor(Math.abs(this.carSpeed) * 50);
                
                if (this.bestTime) {
                    const bestMinutes = Math.floor(this.bestTime / 60000);
                    const bestSeconds = Math.floor((this.bestTime % 60000) / 1000);
                    document.getElementById('bestTime').textContent = `${bestMinutes}:${bestSeconds.toString().padStart(2, '0')}`;
                }
            }
            
            restart() {
                this.currentLap = 1;
                this.startTime = Date.now();
                this.checkpointsPassed = 0;
                this.gameComplete = false;
                
                this.resetCar();
                
                // Reset checkpoints
                this.checkpoints.forEach(checkpoint => {
                    checkpoint.passed = false;
                    if (!checkpoint.isStart) {
                        checkpoint.mesh.material.color.setHex(0xFFFF00);
                    }
                });
                
                document.getElementById('gameOver').style.display = 'none';
            }
            
            animate() {
                requestAnimationFrame(() => this.animate());
                
                this.handleInput();
                this.updateCar();
                this.checkCollisions();
                this.updateUI();
                
                this.renderer.render(this.scene, this.camera);
            }
        }
        
        // Start the game
        const game = new CarRacing();
    </script>
</body>
</html>
